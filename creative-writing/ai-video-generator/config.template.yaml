# 🚀 快速开始

1. 复制此文件为 `config.yaml`
2. 设置 API 密钥（环境变量或直接填写）
3. 根据需要调整参数
4. 开始生成！

```bash
# 设置环境变量
export VOLCANO_API_KEY=your_key

# 运行生成器
python generate_video.py --config config.yaml
```
